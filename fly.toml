# Fly.io 用の設定。Dockerfile 自体はホスト非依存なので Railway / Render に載せ替える場合は
# このファイルを捨てて DATA_DIR とボリュームのマウント先だけ合わせればよい。
#
# 初回:
#   fly launch --no-deploy --copy-config   # app 名 / region を決める
#   fly volumes create data --size 1 --region <region>
#   fly secrets set GEMINI_API_KEY=...
#   fly deploy

app = "misdirection-chat"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  # lib/server/store.ts の永続化先。下の [mounts] と一致させる
  DATA_DIR = "/app/.data"

# 単一プロセス・単一ユーザー前提の JSON ファイル永続化なので、マシンは 1 台に固定する
[[mounts]]
  source = "data"
  destination = "/app/.data"

[http_service]
  internal_port = 3000
  force_https = true
  # 状態（セッション・生成済みの嘘）はプロセス内キャッシュも含めて温めたままにする
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # 将来ローカル ONNX モデルをプロセス内でロードする余地を残す
